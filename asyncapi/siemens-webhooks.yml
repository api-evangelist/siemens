description: Siemens webhook/event surface as documented.
events:
- event: DECISION_RECEIVED
  description: When the credit decision changes; if the deal isn't initially auto-accepted, the credit decision is subject to change when it has
    been assessed by our under‑writers.
- event: CREDIT_STATUS_CHANGED
  description: When the overall status of the proposal changes; for example when the contract has been activated.
- event: attention
  description: Triggered when the attention button is pressed on a tag.
- event: battery
  description: Triggered when the battery level of a tag changes (e.g., transitions from GOOD to MEDIUM) or the voltage changes by more than 0.1.
- event: floorExit
  description: Triggered when a tag leaves a floor.
delivery:
  auth: If an API key was provided during endpoint registration it is sent back in the X-API-KEY request header.
  content_type: POST with empty body; UUID is passed as query parameter.
